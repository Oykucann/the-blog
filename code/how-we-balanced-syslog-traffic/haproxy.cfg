global
    log /dev/log local0
    log /dev/log local1 notice

    localpeer haproxy1

    user haproxy
    group haproxy
    daemon

    maxconn 50000
    ulimit-n 150000

    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log global
    timeout connect 5s
    timeout client  1m
    timeout server  1m

# Peers: stick-table sync between the two HAProxy nodes. Must be
# identical on both nodes; each one knows which entry is "itself"
# via the `localpeer` global directive.
peers haproxy_peers
    peer haproxy1 x.x.x.x:1024
    peer haproxy2 x.x.x.x:1024

# ---- 1. UDP syslog (514/UDP) ----
log-forward syslog_udp_in
    dgram-bind *:514
    maxconn 20000
    timeout client 1m
    option host append
    log backend@syslog_udp_pool len 65535 format rfc5424 local0

backend syslog_udp_pool
    mode log
    balance roundrobin
    option log-health-checks
    server hf1 x.x.x.x:514 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9002 agent-inter 5s
    server hf2 x.x.x.x:514 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9002 agent-inter 5s
    server hf3 x.x.x.x:514 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9002 agent-inter 5s

# ---- 2. TCP syslog (514/TCP) ----
# Started life as a plain `mode tcp` frontend/backend - a raw byte
# proxy with no idea it was carrying syslog. That meant two problems
# at once: it balanced per *connection* (one client = one HF for the
# life of the connection), and it had no way to stamp the real client
# IP onto the message the way the UDP side could.
#
# Moving it into a log-forward section (the same mechanism as UDP,
# just fed by `bind` instead of `dgram-bind`) fixed both: HAProxy now
# parses the syslog message itself, so `option host append` works
# here too, and balancing happens per message instead of per
# connection - even a single long-lived TCP connection now spreads
# its messages across all three HFs.
log-forward syslog_tcp_in
    bind *:514
    maxconn 20000
    timeout client 1m
    option host append
    log backend@syslog_tcp_pool len 65535 format rfc5424 local0

backend syslog_tcp_pool
    mode log
    balance roundrobin
    option log-health-checks
    # fastinter/observe/error-limit: HAProxy has a known rough edge
    # where a log-forward TCP backend connection isn't always
    # recreated cleanly if it drops mid-stream. These make agent-check
    # + live-traffic observation catch a stuck backend faster, as a
    # safety net rather than a real fix.
    server hf1 x.x.x.x:514 check inter 3s fastinter 500ms fall 3 rise 2 weight 100 observe layer4 error-limit 2 agent-check agent-port 9002 agent-inter 5s
    server hf2 x.x.x.x:514 check inter 3s fastinter 500ms fall 3 rise 2 weight 100 observe layer4 error-limit 2 agent-check agent-port 9002 agent-inter 5s
    server hf3 x.x.x.x:514 check inter 3s fastinter 500ms fall 3 rise 2 weight 100 observe layer4 error-limit 2 agent-check agent-port 9002 agent-inter 5s

# ---- 3. Splunk HEC (8088) - HTTP mode, per-request balancing ----
frontend splunk_hec_in
    bind *:8088
    mode http
    option httplog
    default_backend splunk_hec_pool
    http-response set-log-level silent if { status 200 }
    http-response set-log-level warning if { status 400 401 403 429 }
    http-response set-log-level err if { status 500 502 503 504 }

backend splunk_hec_pool
    mode http
    balance roundrobin
    option httpchk GET /services/collector/health
    http-check expect status 200
    option http-keep-alive
    server hf1 x.x.x.x:8088 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9003 agent-inter 5s
    server hf2 x.x.x.x:8088 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9003 agent-inter 5s
    server hf3 x.x.x.x:8088 check inter 3s fall 3 rise 2 weight 100 agent-check agent-port 9003 agent-inter 5s

# ---- Local stats & runtime API ----
listen haproxy_stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /haproxy?stats
    stats refresh 5s
