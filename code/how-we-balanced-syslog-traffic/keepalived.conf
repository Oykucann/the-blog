global_defs {
    router_id HAPROXY1
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2
    timeout 1
    fall 2
    rise 2
}

vrrp_instance VI_HAPROXY {
    state MASTER
    interface ens18

    virtual_router_id 60
    priority 150
    advert_int 1

    unicast_src_ip x.x.x.x

    unicast_peer {
        x.x.x.x
    }

    auth_hmac {
        key 1 file:/etc/keepalived/keys/vrrp60
        active_key 1
        anti_replay time
        time_window 5
        mode enforce
    }

    virtual_ipaddress {
        x.x.x.x/32 dev ens18
    }

    track_script {
        chk_haproxy
    }

    # Runs once, the moment this node takes over the VIP: force-closes
    # any sessions left over from the previously active node, so
    # clients reconnect cleanly onto whichever node is active now.
    notify_master "/usr/local/bin/haproxy_rebalance.sh"
}
