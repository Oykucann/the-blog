#
# HF-side rsyslog config for Splunk syslog ingestion (TCP + UDP, 514).
# Kept entirely in the legacy $-directive style on purpose - mixing it
# with the modern module()/ruleset() object syntax in the same file is
# what crashed this config once already (duplicate ruleset declaration).
#

$ModLoad imtcp
$ModLoad imudp

$Umask 0022
$PreserveFQDN on
$MaxMessageSize 64k
$MainMsgQueueSize 100000
$RulesetCreateMainQueue on

$RuleSet splunk

template (name="splunk_template" type="string"
  string="/data/log/splunk/syslog/%$!splunk_ip%/%$MYHOSTNAME%-%$YEAR%-%$MONTH%-%$DAY%-%$HOUR%-%$QHOUR%.log")

template (name="splunk_message_template" type="string"
  string="%syslogtag%[src_ip=%$!splunk_ip%] %msg%\n")

# HAProxy's "option host append" (both log-forward sections) turns the
# syslog HOSTNAME field into "original_host,real_client_ip". Field 44
# is a comma - split on it to pull the real IP back out on this side.
set $!splunk_host = field($hostname, 44, 1);
set $!splunk_ip   = field($hostname, 44, 2);
if $!splunk_host == "" then {
    set $!splunk_host = $hostname;
}

action(type="omfile" fileOwner="root" fileGroup="root" DirCreateMode="0755" FileCreateMode="0644" dynaFile="splunk_template" dynaFileCacheSize="200" ioBufferSize="64k" template="splunk_message_template")

$InputTCPServerBindRuleset splunk
$InputUDPServerBindRuleset splunk
$InputTCPServerRun 514
$UDPServerRun 514

$RuleSet RSYSLOG_DefaultRuleset
